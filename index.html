<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Werkadmin</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icoon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Werkadmin">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f4f6f3; --card: #ffffff; --ink: #172524; --muted: #5d6d6b; --line: #dfe5e2;
    --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e2f1ee;
    --warn: #8a4b06; --warn-bg: #fff4dd; --err: #a3201a; --err-bg: #fde9e7; --ok: #166534; --ok-bg: #e6f4ea;
    --radius: 16px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101716; --card: #19221f; --ink: #e9f0ee; --muted: #9fb0ad; --line: #2b3633;
      --accent: #2bb3a3; --accent-ink: #062320; --accent-soft: #173a35;
      --warn: #f5c16c; --warn-bg: #3a2b10; --err: #ff9a91; --err-bg: #3d1714; --ok: #8fe0a6; --ok-bg: #143220;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  header { padding: 18px 0 6px; }
  header h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .testband { background: #ffe08a; color: #4a3500; text-align: center; font-size: 13px; font-weight: 600; padding: 6px 12px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; font-weight: 700; }
  h3 { margin: 0 0 4px; font-size: 18px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 10px 16px; font-size: 16px; cursor: pointer; min-height: 44px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: var(--radius); padding: 16px 12px;
    text-align: left; cursor: pointer; min-height: 84px; font-size: 16px; font-weight: 600; }
  .tile span { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .tile.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .opt { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 14px 16px; text-align: left;
    font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; }
  .opt small { color: var(--muted); font-size: 13px; }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
  label.lbl { display: block; font-weight: 600; margin: 18px 0 8px; }
  input[type=text], input[type=date], input[type=number], input[type=password], textarea {
    width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink); min-height: 48px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .stepper { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .stepper button { width: 52px; height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card);
    color: var(--ink); font-size: 26px; cursor: pointer; flex: none; }
  .stepper input { text-align: center; font-size: 24px; font-weight: 700; }
  .info { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-top: 12px; }
  .info b { font-weight: 600; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 14px; font-size: 15px; margin: 10px 0; }
  .err { background: var(--err-bg); color: var(--err); border-radius: 12px; padding: 14px; font-size: 15px; margin: 12px 0; }
  .ok { background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 14px; margin: 12px 0; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 700; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); min-height: 54px; }
  .btn[disabled] { background: var(--line); color: var(--muted); cursor: default; }
  .btn.ghost[disabled] { background: transparent; opacity: .5; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn.small { padding: 10px 14px; min-height: 44px; font-size: 15px; width: auto; display: inline-block; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sticky { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); padding: 12px 0 4px; background: linear-gradient(transparent, var(--bg) 30%); }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav .wrap { display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 4px; }
  nav button { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 8px 0 10px; cursor: pointer; font-weight: 600; }
  nav button .ic { display: block; font-size: 22px; line-height: 1.2; }
  nav button.on { color: var(--accent); }
  table.kv { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.kv td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.kv td:last-child { text-align: right; font-weight: 600; }
  table.kv tr.tot td { border-bottom: 0; font-size: 18px; padding-top: 10px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .modal { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .modal h3 { font-size: 21px; margin-bottom: 12px; }
  .stack > * + * { margin-top: 10px; }
  .grp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .bedrag { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-top: 8px; min-height: 32px; }
  .daglijst { font-size: 14px; margin: 6px 0 0; padding: 0; list-style: none; }
  .daglijst li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .maand { display: grid; grid-template-columns: 52px 1fr 78px; gap: 10px; align-items: center; padding: 9px 4px; border-radius: 10px;
    cursor: pointer; border: 0; background: none; color: var(--ink); width: 100%; text-align: left; font-size: 15px; }
  .maand.on { background: var(--accent-soft); font-weight: 700; }
  .maand span:last-child { text-align: right; }
  .stapel { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--line); }
  .stapel > i { display: block; height: 100%; flex: none; }
  .stapel > i + i { box-shadow: inset 1.5px 0 0 var(--card); }
  .c-praktijk { background: #2a9d8f; } .c-hap { background: #e76f51; } .c-reistijd { background: #9aa5a3; }
  .c-admin { background: #5b7bd5; } .c-verlof { background: #d98cb3; } .c-nascholing { background: #e9b335; } .c-intervisie { background: #a660b4; } .c-overig { background: #8d6e5a; }
  .c-km { background: #9aa5a3; }
  .seg { display: inline-flex; background: var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; padding: 6px 14px;
    border-radius: 999px; cursor: pointer; min-height: 34px; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .kop-rij { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 10px; }
  .kop-rij h2 { margin: 0; }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); padding: 4px 6px 10px; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; }
  .legenda span i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .tip { position: fixed; z-index: 40; pointer-events: none; background: #172524; color: #fff; border-radius: 10px; padding: 8px 11px;
    font-size: 13px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0,0,0,.25); max-width: 230px; }
  .tip b { display: block; font-size: 14px; }
  .tip .r { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
  .tip .r i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
  .uitsplitsing { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .uitsplitsing span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; }
  .uitsplitsing span i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .big { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom)); background: #172524;
    color: #fff; padding: 14px 16px; border-radius: 14px; z-index: 30; display: flex; gap: 14px; align-items: center; justify-content: space-between;
    width: calc(100% - 32px); max-width: 528px; font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .toast button { flex: none; }
  .toast button { background: none; border: 0; color: #7fe3d6; font-weight: 700; font-size: 15px; cursor: pointer; }
  .laden { text-align: center; padding: 40px 0; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: draai .8s linear infinite; margin: 0 auto 10px; }
  @keyframes draai { to { transform: rotate(360deg); } }
  .check { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); font-size: 36px;
    display: flex; align-items: center; justify-content: center; margin: 10px auto; }
  .center { text-align: center; }
  .recent li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .recent li:last-child { border-bottom: 0; }
  .recent ul { list-style: none; margin: 0; padding: 0; }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 16px; min-height: 44px; }
  .pin-invoer { text-align: center; font-size: 28px !important; letter-spacing: .4em; font-weight: 700; }
  .pin-invoer::placeholder { letter-spacing: normal; font-size: 17px; font-weight: 400; }
  body.op-slot nav { display: none; }
  body.op-slot .kop-knop { display: none; }
  .sync { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 15; margin: 0; font-size: 12px; font-weight: 600; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; }
  .sync[hidden] { display: none; }
  .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: puls 1s ease-in-out infinite; }
  @keyframes puls { 50% { opacity: .25; } }
  .kop { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .kop-knop { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 6px 12px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 34px; }
  .pt-knop { flex: none; border: 1.5px dashed var(--accent); background: none; color: var(--accent); border-radius: 999px; padding: 6px 12px;
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 36px; white-space: nowrap; }
  .pt-knop.heeft { border-style: solid; background: var(--accent-soft); }
  .recent li.nas-dag { align-items: center; }
  .switch input { width: 22px; height: 22px; accent-color: var(--accent); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div id="testband"></div>
<div class="wrap">
  <header>
    <div class="kop"><h1 id="titel">Werkadmin</h1><button id="pinwijzig" class="kop-knop" type="button">🔒 Pincode</button></div>
    <p id="subtitel">Even laden…</p>
    <p id="sync" class="sync" hidden><span class="dot"></span>Bijwerken…</p>
  </header>
  <main id="view"><div class="laden"><div class="spinner"></div>Gegevens ophalen…</div></main>
</div>
<nav>
  <div class="wrap">
    <button data-tab="invullen" class="on"><span class="ic">✎</span>Invullen</button>
    <button data-tab="facturen"><span class="ic">€</span>Facturen</button>
    <button data-tab="overzicht"><span class="ic">▤</span>Overzicht</button>
    <button data-tab="nascholing"><span class="ic">★</span>Nascholing</button>
  </div>
</nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ===================== Basis ===================== */
var S = { init: null, tab: 'invullen', f: null, bezig: false, overzicht: { jaar: null, maand: null, eenheid: (function () { try { return localStorage.getItem('werkadmin-eenheid') === 'eur' ? 'eur' : 'uur'; } catch (e) { return 'uur'; } })() }, nascholingJaar: null };
var CATS = [['praktijk','Praktijk'],['hap','HAP-dienst'],['reistijd','Reistijd'],['admin','Administratie'],['verlof','Verlof'],['nascholing','Nascholing'],['intervisie','Intervisie / FTO'],['overig','Overig']];
var EURCATS = [['praktijk','Praktijk'],['km','KM-vergoeding'],['hap','HAP-dienst'],['overig','Overig']];
var MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
var DAGEN = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];

function $(s, el) { return (el || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nf(x, dec) { return Number(x || 0).toLocaleString('nl-NL', { minimumFractionDigits: 0, maximumFractionDigits: dec == null ? 2 : dec }); }
function geld(x) { return '€ ' + Number(x || 0).toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function uurTekst(x) { return nf(x) + ' uur'; }
function parseNum(v) {
  var s = String(v == null ? '' : v).trim().replace(/\s/g, '');
  if (s === '') return null;
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/\./g, '');
  s = s.replace(',', '.');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return Number(s);
}
function keyNaarDate(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function dateNaarKey(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function plusDagen(k, n) { var d = keyNaarDate(k); d.setDate(d.getDate() + n); return dateNaarKey(d); }
function datumLang(k) { var d = keyNaarDate(k); return DAGEN[d.getDay()] + ' ' + d.getDate() + ' ' + MAANDEN[d.getMonth()] + (d.getFullYear() !== keyNaarDate(S.init.vandaag).getFullYear() ? ' ' + d.getFullYear() : ''); }
function datumKort(k) { var d = keyNaarDate(k); return DAGEN[d.getDay()].slice(0, 2) + ' ' + d.getDate() + ' ' + MAANDEN[d.getMonth()].slice(0, 3); }
function maandNaam(ym) { var p = ym.split('-'); return MAANDEN[Number(p[1]) - 1] + ' ' + p[0]; }
function dagenVerschil(a, b) { return Math.round((keyNaarDate(a) - keyNaarDate(b)) / 86400000); }

var SLEUTEL_KEY = 'werkadmin-sessie';
function sleutel() { try { return localStorage.getItem(SLEUTEL_KEY) || ''; } catch (e) { return S.sleutel || ''; } }
function bewaarSleutel(k) { S.sleutel = k; try { if (k) localStorage.setItem(SLEUTEL_KEY, k); else localStorage.removeItem(SLEUTEL_KEY); } catch (e) {} }
var API_URL = 'https://script.google.com/macros/s/AKfycbxga8LkzfJvxvSr4ZKV-Tunc0qZiT3YUuE5xapmynsl2e_wCJJMAyeAwIfe1BM8NDMNWA/exec';
function rpc(fn, args) {
  if (window.google && google.script && google.script.run) {
    return new Promise(function (ok, nok) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { nok(e); });
      r[fn].apply(r, args);
    });
  }
  // GitHub-versie: rechtstreeks naar de Apps Script-ingang, zonder Google-cookies.
  return fetch(API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { if (!r.ok) throw new Error('NetworkError ' + r.status); return r.json(); })
    .then(function (d) { if (!d.ok) throw new Error(d.fout); return d.res; });
}
/* Onthouden van gelezen gegevens op dit apparaat, zodat schermen meteen verschijnen.
   Opslaan gaat altijd rechtstreeks naar de sheet; na elke wijziging wordt het geheugen gewist. */
var LEES = { getInit: 1, getFacturen: 1, getOverzicht: 1, getNascholingen: 1 };
var CACHE_PREFIX = 'werkadmin-c:';
function cacheKey(fn, args) { return CACHE_PREFIX + fn + ':' + JSON.stringify(args); }
function cacheLees(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function cacheZet(k, d) { try { localStorage.setItem(k, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {} }
function cacheWis() {
  try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(CACHE_PREFIX) === 0) localStorage.removeItem(k); }); } catch (e) {}
}
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var lees = LEES[fn] === 1;
  return rpc('api', [sleutel(), fn, args]).then(function (d) {
    if (lees) cacheZet(cacheKey(fn, args), d); else if (fn !== 'getDag') cacheWis();
    return d;
  }, function (e) {
    if (!lees && fn !== 'getDag') cacheWis();
    if (/PINCODE_NODIG/.test(e && e.message || String(e))) { cacheWis(); bewaarSleutel(''); toonPinScherm(); throw new Error('Typ eerst je pincode.'); }
    throw e;
  });
}

/* Toon meteen wat er onthouden is, haal op de achtergrond de nieuwste stand op. */
function snelLaad(tab, fn, args, render, tekst, opnieuw) {
  var mijn = S.laadId = (S.laadId || 0) + 1;
  var c = cacheLees(cacheKey(fn, args));
  var getoond = c ? JSON.stringify(c.d) : null;
  sync(!!c);
  if (c) render(c.d); else $('#view').innerHTML = '<div class="laden"><div class="spinner"></div>' + esc(tekst) + '</div>';
  call.apply(null, [fn].concat(args)).then(function (d) {
    if (S.laadId !== mijn || S.tab !== tab) return;
    sync(false);
    if (getoond === JSON.stringify(d)) return;
    var bezig = $('#modal').innerHTML || (document.activeElement && document.activeElement.closest && document.activeElement.closest('#view input, #view textarea'));
    if (getoond && bezig) return; // niet onder iemands handen verversen; de volgende keer staat het goed
    var y = window.scrollY; render(d); if (getoond) window.scrollTo(0, y);
  }).catch(function (e) {
    if (S.laadId !== mijn) return;
    sync(false);
    if (getoond) toast('Kon niet verversen: ' + foutTekst(e));
    else $('#view').innerHTML = '<div class="err">' + esc(foutTekst(e)) + '</div><button class="btn" onclick="' + opnieuw + '()">Opnieuw</button>';
  });
}
function sync(aan) { var el = $('#sync'); if (el) el.hidden = !aan; }

function vooruitLaden() {
  var j = Number(S.init.vandaag.slice(0, 4)), m = Number(S.init.vandaag.slice(5, 7));
  setTimeout(function () {

function foutTekst(e) {
  var m = (e && e.message) ? e.message : String(e);
  if (/Authorization|autoris|permission|toestemming|rechten/i.test(m)) return 'De app heeft geen toegang tot de sheet. Vraag Nino om dit te controleren.';
  if (/NetworkError|Failed to fetch|network/i.test(m)) return 'Geen internetverbinding. Er is niets opgeslagen. Probeer het opnieuw zodra je online bent.';

/* ===================== Feestdagen (voorstel dienstsoort) ===================== */
function pasen(j) {
  var a = j % 19, b = Math.floor(j / 100), c = j % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    maand = Math.floor((h + l - 7 * m + 114) / 31), dag = ((h + l - 7 * m + 114) % 31) + 1;
  return j + '-' + ('0' + maand).slice(-2) + '-' + ('0' + dag).slice(-2);
}
function feestdag(k) {
  var j = Number(k.slice(0, 4)), p = pasen(j), lijst = {};
  lijst[j + '-01-01'] = 'Nieuwjaarsdag';
  lijst[p] = 'Eerste Paasdag'; lijst[plusDagen(p, 1)] = 'Tweede Paasdag';
  var kd = j + '-04-27'; if (keyNaarDate(kd).getDay() === 0) kd = j + '-04-26';
  lijst[kd] = 'Koningsdag';
  lijst[plusDagen(p, 39)] = 'Hemelvaartsdag';
  lijst[plusDagen(p, 49)] = 'Eerste Pinksterdag'; lijst[plusDagen(p, 50)] = 'Tweede Pinksterdag';
  lijst[j + '-12-25'] = 'Eerste Kerstdag'; lijst[j + '-12-26'] = 'Tweede Kerstdag';
  return lijst[k] || null;
}
function dienstVoorstel(k) {
  var f = feestdag(k);
  if (f) return { soort: 'Feestdag', reden: f };
  var dag = keyNaarDate(k).getDay();
  if (dag === 0 || dag === 6) return { soort: 'Weekend', reden: DAGEN[dag] };
  return { soort: 'Doordeweeks', reden: DAGEN[dag] };
}

  var f = S.f;
  if (f.soort === 'praktijk') {
    if (!f.praktijk) return 'Kies een praktijk.';
    if (!gekozenPraktijk()) return 'Kies voor wie je werkte.';
  }
  if (f.soort === 'hap') {
    if (!gekozenHap()) return 'Kies een huisartsenpost.';
    if (!f.dienstSoort) return 'Kies het soort dienst.';
  }
  if ((f.soort === 'admin' || f.soort === 'nascholing' || f.soort === 'intervisie') && !String(f.omschrijving).trim()) return 'Vul een omschrijving in.';
  var u = parseNum(f.uren);
  if (u === null) return 'Vul het aantal uren in.';
  if (isNaN(u) || u <= 0 || u > 24) return 'Het aantal uren klopt niet.';
  if (Math.abs(u * 4 - Math.round(u * 4)) > 1e-9) return 'Vul uren in per kwartier (bijv. 8,75).';
  if (f.soort === 'praktijk') {
    var vk = parseNum(f.visiteKm);
    if (vk === null) return 'Vul de visite-kilometers in (0 als je geen visites had).';
    if (isNaN(vk) || vk < 0) return 'Het aantal visite-kilometers klopt niet.';
  }
  if (f.soort === 'nascholing' || f.soort === 'intervisie') {
    var rt = parseNum(f.reistijd), km = parseNum(f.km), pt = parseNum(f.punten);
    if (f.opLocatie && rt !== null && (isNaN(rt) || rt < 0 || rt > 12)) return 'De reistijd klopt niet.';
    if (f.opLocatie && km !== null && (isNaN(km) || km < 0)) return 'Het aantal kilometers klopt niet.';
    if (pt !== null && (isNaN(pt) || pt < 0)) return 'Het aantal punten klopt niet.';
  }
  return '';
}

function kiesDatum(k) {
  var f = S.f;
  if (!k) return;
  f.datum = k; f.dag = null; f.dagFout = null; f.vervangen = false; f.dagLaden = true;
  if (f.soort === 'hap') f.dienstSoort = dienstVoorstel(k).soort;
  renderInvullen();
  var gevraagd = k;
  call('getDag', k).then(function (d) {
    if (S.f.datum !== gevraagd) return;
    f.dag = d; f.dagLaden = false; renderInvullen();
  }).catch(function (e) {
    if (S.f.datum !== gevraagd) return;
    f.dagLaden = false; f.dagFout = foutTekst(e); renderInvullen();
  });
}

function koppelInvullen() {
  var f = S.f, v = $('#view');
  v.querySelectorAll('[data-datum]').forEach(function (b) { b.onclick = function () { kiesDatum(b.getAttribute('data-datum')); }; });
  var dk = $('#datumkies'); if (dk) dk.onchange = function () { if (dk.value) kiesDatum(dk.value); };
  v.querySelectorAll('[data-soort]').forEach(function (b) { b.onclick = function () {
    var s = b.getAttribute('data-soort');
    if (s === 'nascholing' && f.soort === 'intervisie') return;
    if (f.soort !== s) { f.omschrijving = ''; }
    f.soort = s;
    if (s === 'hap' && !f.dienstSoort) f.dienstSoort = dienstVoorstel(f.datum).soort;
    renderInvullen();
  }; });
  v.querySelectorAll('[data-sub]').forEach(function (b) { b.onclick = function () { f.soort = b.getAttribute('data-sub'); f.omschrijving = ''; renderInvullen(); }; });
  v.querySelectorAll('[data-praktijk]').forEach(function (b) { b.onclick = function () {
    f.praktijk = b.getAttribute('data-praktijk');
    var vs = varianten(f.praktijk);
    f.praktijkKey = vs.length === 1 ? vs[0].key : null;
    renderInvullen();
  }; });
  v.querySelectorAll('[data-pkey]').forEach(function (b) { b.onclick = function () { f.praktijkKey = b.getAttribute('data-pkey'); renderInvullen(); }; });
  v.querySelectorAll('[data-hap]').forEach(function (b) { b.onclick = function () { f.hapKey = b.getAttribute('data-hap'); renderInvullen(); }; });
  v.querySelectorAll('[data-dienst]').forEach(function (b) { b.onclick = function () { f.dienstSoort = b.getAttribute('data-dienst'); renderInvullen(); }; });
  v.querySelectorAll('[data-oms]').forEach(function (b) { b.onclick = function () { f.omschrijving = b.getAttribute('data-oms'); renderInvullen(); }; });
  v.querySelectorAll('[data-visite]').forEach(function (b) { b.onclick = function () { f.visiteKm = '0'; renderInvullen(); }; });
  v.querySelectorAll('[data-stap]').forEach(function (b) { b.onclick = function () {
    var u = parseNum(f.uren); if (u === null || isNaN(u)) u = 0;
    u = Math.round((u + Number(b.getAttribute('data-stap'))) * 4) / 4;
    if (u < 0) u = 0; if (u > 24) u = 24;
    f.uren = u ? String(u).replace('.', ',') : '';
    renderInvullen();
  }; });
  // Tekstvelden: bijwerken zonder het scherm opnieuw op te bouwen (cursor blijft staan)
  var velden = { uren: 'uren', visite: 'visiteKm', oms: 'omschrijving', loc: 'locatie', rt: 'reistijd', km: 'km', punten: 'punten' };
  Object.keys(velden).forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.oninput = function () { f[velden[id]] = el.value; werkKnopBij(); };
  });
  var ol = $('#oplocatie'); if (ol) ol.onchange = function () { f.opLocatie = ol.checked; renderInvullen(); };
  v.querySelectorAll('[data-actie]').forEach(function (b) { b.onclick = function (e) {
    e.preventDefault();
    var a = b.getAttribute('data-actie');
    if (a === 'anderedag') { f.datum = null; f.dag = null; renderInvullen(); }
    if (a === 'vervang') { f.vervangen = true; renderInvullen(); }
    if (a === 'nietvervangen') { f.vervangen = false; renderInvullen(); }
    if (a === 'anderepraktijk') { f.praktijk = null; f.praktijkKey = null; renderInvullen(); }
    if (a === 'anderehap') { f.hapKey = null; renderInvullen(); }
    if (a === 'controleer') toonControle();
  }; });
}

function werkKnopBij() {
  var knop = $('[data-actie="controleer"]');
  if (!knop) return;
  var fout = valideer();
  knop.disabled = !!fout;
  var p = knop.parentNode.querySelector('p');
  if (fout && !p) { p = document.createElement('p'); p.className = 'small muted center'; p.style.margin = '6px 0 0'; knop.parentNode.appendChild(p); }
  if (p) p.textContent = fout;
  // visite-chip in sync houden
  var vc = $('[data-visite]'); if (vc) vc.classList.toggle('on', S.f.visiteKm === '0');
}

/* ---------- Controle + opslaan ---------- */
function berekening() {
  var f = S.f, u = parseNum(f.uren), r = { regels: [], waarschuwingen: [] };
  r.regels.push(['Datum', datumLang(f.datum)]);
  if (f.soort === 'praktijk') {
    var p = gekozenPraktijk(), vk = parseNum(f.visiteKm);
    var bedrag = u * p.tarief, kmv = (p.km + vk) * p.kmTarief;
    r.regels.push(['Praktijk', p.tekst], ['Locatie', p.locatie], ['Gewerkte uren', uurTekst(u)], ['Reistijd', uurTekst(p.reistijd)],
      ['KM woon-werk', nf(p.km, 1) + ' km'], ['KM visites', nf(vk, 1) + ' km'], ['Uurtarief', geld(p.tarief)], ['KM-tarief', geld(p.kmTarief)],
      ['Bedrag werk', geld(bedrag)], ['KM-vergoeding', geld(kmv)]);
    r.totaal = bedrag + kmv;
    var wd = keyNaarDate(f.datum).getDay();
    if (wd === 0 || wd === 6) r.waarschuwingen.push('Een praktijkdag op ' + DAGEN[wd] + ' — klopt dat?');
    if (vk > 60) r.waarschuwingen.push(nf(vk) + ' km voor visites is veel — klopt dat?');
    r.verwacht = { tarief: p.tarief, kmTarief: p.kmTarief, km: p.km, reistijd: p.reistijd };
  } else if (f.soort === 'hap') {
    var h = gekozenHap(), t = instelling().diensten[f.dienstSoort];
    r.regels.push(['Huisartsenpost', h.tekst], ['Locatie', h.locatie], ['Soort dienst', f.dienstSoort], ['Gewerkte uren', uurTekst(u)],
      ['Reistijd', uurTekst(h.reistijd)], ['KM woon-werk', nf(h.km, 1) + ' km'], ['Uurtarief', geld(t)]);
    r.totaal = u * t;
    var vs = dienstVoorstel(f.datum);
    if (vs.soort !== f.dienstSoort) r.waarschuwingen.push('Je koos "' + f.dienstSoort + '", maar het is ' + vs.reden + ' (meestal "' + vs.soort + '"). Klopt dat met de Waarneem-app?');
    r.verwacht = { tarief: t, km: h.km, reistijd: h.reistijd };
  } else {
    var soortNaam = { admin: 'Administratie', nascholing: 'Nascholing / cursus', intervisie: 'Intervisie / FTO' }[f.soort];
    r.regels.push([soortNaam, String(f.omschrijving).trim()], ['Uren', uurTekst(u)]);
    if (f.soort !== 'admin' && f.opLocatie) {
      if (String(f.locatie).trim()) r.regels.push(['Locatie', String(f.locatie).trim()]);
      if (parseNum(f.reistijd)) r.regels.push(['Reistijd', uurTekst(parseNum(f.reistijd))]);
      if (parseNum(f.km)) r.regels.push(['KM woon-werk', nf(parseNum(f.km), 1) + ' km']);
    }
    if (f.soort !== 'admin' && parseNum(f.punten)) r.regels.push(['Accreditatiepunten', nf(parseNum(f.punten)) + ' (komt ook in je nascholingslijst)']);
  }
  if (u > 11) r.waarschuwingen.push(uurTekst(u) + ' is een lange dag — klopt dat?');
  var verschil = dagenVerschil(f.datum, S.init.vandaag);
  if (verschil > 0) r.waarschuwingen.push('Deze datum ligt in de toekomst.');
  if (verschil < -45) r.waarschuwingen.push('Deze datum is meer dan 6 weken geleden.');
  return r;
}

function toonControle() {
  if (valideer()) return;
  var r = berekening(), h = '<h3>Klopt dit?</h3>';
  if (S.f.vervangen) h += '<div class="warn">Dit vervangt: ' + esc(dagSamenvatting(S.f.dag.dag)) + '</div>';
  r.waarschuwingen.forEach(function (w) { h += '<div class="warn">⚠ ' + esc(w) + '</div>'; });
  h += '<div class="card"><table class="kv">';
  r.regels.forEach(function (x) { h += '<tr><td>' + esc(x[0]) + '</td><td>' + esc(x[1]) + '</td></tr>'; });
  if (r.totaal != null) h += '<tr class="tot"><td>Totaal</td><td>' + esc(geld(r.totaal)) + '</td></tr>';
  h += '</table></div><p class="small muted">Komt in <b>' + esc(S.f.dag.tab) + '</b>, rij ' + S.f.dag.rij + '.</p>' +
    '<div id="opslaanfout"></div><div class="stack"><button class="btn" id="opslaan">Ja, opslaan</button>' +
    '<button class="btn ghost" id="terug">Aanpassen</button></div>';
  modal(h);
  $('#terug').onclick = function () { modal(''); };
  $('#opslaan').onclick = function () { opslaan(r); };
}

function opslaan(r) {
  if (S.bezig) return;
  S.bezig = true;
  var knop = $('#opslaan'); knop.disabled = true; knop.textContent = 'Opslaan en controleren…';
  $('#terug').disabled = true;
  var f = S.f;
  var inv = { datum: f.datum, soort: f.soort, uren: f.uren, praktijkKey: f.praktijkKey, visiteKm: f.visiteKm, hapKey: f.hapKey,
    dienstSoort: f.dienstSoort, omschrijving: f.omschrijving, punten: f.soort === 'admin' ? '' : f.punten, verwacht: r.verwacht,
    locatie: f.opLocatie ? f.locatie : '', reistijd: f.opLocatie ? f.reistijd : '', km: f.opLocatie ? f.km : '',
    vervangen: f.vervangen, vingerafdruk: f.dag && f.dag.vingerafdruk };
  call('slaDagOp', inv).then(function (res) {
    S.bezig = false;
    if (res.status === 'bezet') {
      modal('');
      f.dag = { datum: f.datum, tab: res.tab, rij: res.rij, gevuld: true, dag: res.dag, vingerafdruk: res.vingerafdruk };
      f.vervangen = false;
      renderInvullen();
      toast(res.melding || 'Op deze dag staat al iets. Er is niets overschreven.');
      return;
    }
    modal('');
    f.klaar = res;
    call('getInit').then(function (d) { S.init.recent = d.recent; S.init.instellingen = d.instellingen; }).catch(function () {});
    renderInvullen();
  }).catch(function (e) {
    S.bezig = false;
    var fe = $('#opslaanfout');
    if (fe) fe.innerHTML = '<div class="err"><b>Niet opgeslagen.</b><br>' + esc(foutTekst(e)) + '</div>';
    knop.disabled = false; knop.textContent = 'Opnieuw proberen'; $('#terug').disabled = false;
  });
}

function renderKlaar() {
  var res = S.f.klaar, d = res.dag;
  var h = '<div class="card center" style="margin-top:16px"><div class="check">✓</div><h3>Opgeslagen en gecontroleerd</h3>' +
    '<p class="muted small">' + esc(datumLang(d.datum)) + ' staat in <b>' + esc(res.tab) + '</b>, rij ' + res.rij + '.</p>' +
    '<table class="kv" style="text-align:left"><tr><td>' + esc(d.label) + '</td><td>' + esc(uurTekst(d.uren)) + '</td></tr>';
  if (d.totaal) h += '<tr class="tot"><td>Totaal</td><td>' + esc(geld(d.totaal)) + '</td></tr>';
  h += '</table></div><div class="stack"><button class="btn" id="nogeen">Nog een dag invullen</button>' +
    '<a class="btn ghost center" style="text-decoration:none" href="' + esc(S.init.sheetUrl) + '" target="_blank" rel="noopener">Bekijk in de sheet</a></div>';
  $('#view').innerHTML = h;
  $('#nogeen').onclick = function () { nieuwFormulier(); renderInvullen(); };
}

/* ===================== Facturen ===================== */
function laadFacturen() {
  snelLaad('facturen', 'getFacturen', [], renderFacturen, 'Facturen ophalen…', 'laadFacturen');
}

function renderFacturen(d) {
  S.facturen = d;
  var h = '<p class="small muted">Leeg in de sheet = nog factureren · <b>?</b> = factuur verstuurd · <b>*</b> = betaald.</p>';
  h += '<h2>Nog te factureren</h2>';
  if (!d.open.length) h += '<div class="card muted">Alles is gefactureerd. 🎉</div>';
  d.open.forEach(function (g, i) { h += groepKaart(g, 'open', i); });
  h += '<h2>Wacht op betaling</h2>';
  if (!d.verstuurd.length) h += '<div class="card muted">Er staan geen facturen open.</div>';
  d.verstuurd.forEach(function (g, i) { h += groepKaart(g, 'verstuurd', i); });
  $('#view').innerHTML = h;
  document.querySelectorAll('[data-groep]').forEach(function (b) {
    b.onclick = function () {
      var p = b.getAttribute('data-groep').split(':');
      var g = S.facturen[p[0]][Number(p[1])];
      bevestigStatus(g, p[0] === 'open' ? 'verstuurd' : 'betaald');
    };
  });
}

function groepKaart(g, soort, i) {
  var h = '<div class="card"><div class="grp-head"><div><h3>' + esc(g.naam) + '</h3><div class="muted small">' + esc(maandNaam(g.maand)) +
    ' · ' + g.dagen.length + (g.dagen.length === 1 ? ' dag' : ' dagen') + ' · ' + esc(uurTekst(g.uren)) + '</div>' +
    (g.lopend && soort === 'open' ? '<span class="tag">Deze maand loopt nog</span>' : '') + '</div><div class="bedrag">' + esc(geld(g.totaal)) + '</div></div>' +
    '<details><summary>Bekijk de dagen</summary><ul class="daglijst">';
  g.dagen.forEach(function (x) { h += '<li><span>' + esc(datumKort(x.datum)) + ' · ' + esc(uurTekst(x.uren)) + '</span><span>' + esc(geld(x.totaal)) + '</span></li>'; });
  h += '</ul>' + (g.kmVerg ? '<p class="small muted">Waarvan werk ' + esc(geld(g.bedrag)) + ' en km-vergoeding ' + esc(geld(g.kmVerg)) + '.</p>' : '') + '</details>' +
    '<div style="margin-top:12px"><button class="btn small' + (g.lopend && soort === 'open' ? ' ghost' : '') + '" data-groep="' + soort + ':' + i + '">' +
    (soort === 'open' ? 'Factuur verstuurd' : 'Betaald ontvangen') + '</button></div></div>';
  return h;
}

function bevestigStatus(g, nieuw) {
  var oud = g.status;
  var tekst = nieuw === 'verstuurd'
    ? 'Heb je de factuur voor <b>' + esc(g.naam) + '</b> over <b>' + esc(maandNaam(g.maand)) + '</b> (' + esc(geld(g.totaal)) + ') verstuurd?'
    : 'Is de betaling van <b>' + esc(g.naam) + '</b> over <b>' + esc(maandNaam(g.maand)) + '</b> (' + esc(geld(g.totaal)) + ') binnen?';
  modal('<h3>' + (nieuw === 'verstuurd' ? 'Factuur verstuurd?' : 'Betaling ontvangen?') + '</h3><p>' + tekst + '</p>' +
    '<p class="small muted">Bij ' + g.dagen.length + (g.dagen.length === 1 ? ' dag' : ' dagen') + ' komt in de sheet een <b>' + (nieuw === 'verstuurd' ? '?' : '*') + '</b> te staan.</p>' +
    (g.lopend && nieuw === 'verstuurd' ? '<div class="warn">Let op: deze maand is nog niet voorbij.</div>' : '') +
    '<div id="statusfout"></div><div class="stack"><button class="btn" id="ja">Ja</button><button class="btn ghost" id="nee">Annuleren</button></div>');
  $('#nee').onclick = function () { modal(''); };
  $('#ja').onclick = function () {
    var knop = $('#ja'); knop.disabled = true; knop.textContent = 'Bezig…';
    var dagen = g.dagen.map(function (x) { return { tab: x.tab, rij: x.rij, datum: x.datum }; });
    call('zetStatus', dagen, nieuw, oud).then(function () {
      modal('');
      laadFacturen();
      toast(g.naam + ': ' + (nieuw === 'verstuurd' ? 'factuur verstuurd' : 'betaald'), 'Ongedaan maken', function () {
        call('zetStatus', dagen, oud, nieuw).then(function () { laadFacturen(); toast('Teruggezet.'); })
          .catch(function (e) { toast(foutTekst(e)); });
      });
    }).catch(function (e) {
      $('#statusfout').innerHTML = '<div class="err">' + esc(foutTekst(e)) + '</div>';
      knop.disabled = false; knop.textContent = 'Opnieuw proberen';
    });
  };
}

/* ===================== Overzicht ===================== */
function laadOverzicht() {
  var o = S.overzicht, v = S.init.vandaag;
  if (!o.jaar) { o.jaar = Number(v.slice(0, 4)); o.maand = Number(v.slice(5, 7)); }
  snelLaad('overzicht', 'getOverzicht', [o.jaar, o.maand], renderOverzicht, 'Overzicht maken…', 'laadOverzicht');
}

function renderOverzicht(d) {
  var h = '<div class="chips" style="margin-top:8px">';
  d.jaren.filter(function (j) { return Number(j) >= 2025; }).forEach(function (j) {
    h += '<button class="chip' + (Number(j) === d.jaar ? ' on' : '') + '" data-jaar="' + j + '">' + j + '</button>';
  });
  h += '</div>';
  var pct = Math.min(100, d.totaalUren / d.doel * 100);
  h += '<div class="card" style="margin-top:12px"><div class="muted small">Alle gewerkte uren in ' + d.jaar + '</div><div class="big">' + esc(nf(d.totaalUren, 1)) + ' uur</div>' +
    '<div class="bar" style="margin:10px 0 6px"><i style="width:' + pct + '%"></i></div>' +
    '<div class="small muted">' + (d.totaalUren >= d.doel ? 'Urencriterium van ' + nf(d.doel) + ' uur gehaald ✓' : 'Nog ' + esc(nf(d.doel - d.totaalUren, 1)) + ' uur tot het urencriterium (' + nf(d.doel) + ' uur)') + '</div>' +
    '<table class="kv" style="margin-top:12px">';
  var c = d.categorieen;
  [['Praktijk', c.praktijk], ['HAP-diensten', c.hap], ['Reistijd', c.reistijd], ['Administratie', c.admin], ['Verlof (telt mee)', c.verlof], ['Nascholing', c.nascholing], ['Intervisie / FTO', c.intervisie], ['Overig', c.overig]]
    .forEach(function (x) { if (x[1]) h += '<tr><td>' + x[0] + '</td><td>' + esc(uurTekst(Math.round(x[1] * 100) / 100)) + '</td></tr>'; });
  h += '<tr class="tot"><td>Omzet</td><td>' + esc(geld(d.omzet)) + '</td></tr></table></div>';

  var eur = S.overzicht.eenheid === 'eur';
  var cats = eur ? EURCATS : CATS;
  var waarde = function (m, k) { return (eur ? (m.eur || {}) : (m.cat || {}))[k] || 0; };
  var som = function (m) { return eur ? m.omzet : m.totaal; };
  var fmt = function (x) { return eur ? geld(x) : nf(x, 2) + ' u'; };
  h += '<div class="kop-rij"><h2>Per maand</h2><div class="seg" role="group" aria-label="Eenheid">' +
    '<button data-eenheid="uur" class="' + (eur ? '' : 'on') + '">Uren</button><button data-eenheid="eur" class="' + (eur ? 'on' : '') + '">EUR</button></div></div>';
  h += '<div class="card" style="padding:8px">';
  var gebruikt = cats.filter(function (k) { return d.maanden.some(function (m) { return waarde(m, k[0]) > 0; }); });
  if (gebruikt.length) h += '<div class="legenda">' + gebruikt.map(function (k) { return '<span><i class="c-' + k[0] + '"></i>' + k[1] + '</span>'; }).join('') + '</div>';
  var max = Math.max.apply(null, d.maanden.map(som).concat([1]));
  d.maanden.forEach(function (m) {
    var seg = '';
    cats.forEach(function (k) {
      var u = waarde(m, k[0]);
      if (u > 0) seg += '<i class="c-' + k[0] + '" style="width:' + (u / max * 100) + '%" data-tip-cat="' + k[0] + '"></i>';
    });
    h += '<button class="maand' + (m.maand === d.maand ? ' on' : '') + '" data-maand="' + m.maand + '"><span>' + MAANDEN[m.maand - 1].slice(0, 3) + '</span>' +
      '<span class="stapel">' + seg + '</span><span>' + esc(eur ? geldKort(som(m)) : fmt(som(m))) + '</span></button>';
  });
  h += '</div>';

  var mo = d.maanden[d.maand - 1];
  h += '<h2>' + esc(MAANDEN[d.maand - 1]) + ' ' + d.jaar + ' per praktijk</h2>';
  h += '<p class="small muted">Totaal <b>' + esc(eur ? geld(mo.omzet) : uurTekst(Math.round(mo.totaal * 100) / 100)) + '</b> in ' + esc(MAANDEN[d.maand - 1]) + '. Leg dit naast Yuki.</p>';
  var uit = cats.filter(function (k) { return waarde(mo, k[0]) > 0; });
  if (uit.length) h += '<div class="uitsplitsing" style="margin:-4px 0 12px">' + uit.map(function (k) {
    var w = waarde(mo, k[0]);
    return '<span><i class="c-' + k[0] + '"></i>' + k[1] + ' ' + esc(eur ? geld(w) : uurTekst(Math.round(w * 100) / 100)) + '</span>'; }).join('') + '</div>';
  if (!d.perPraktijk.length) h += '<div class="card muted">Geen praktijkdagen of diensten in deze maand.</div>';
  var tot = 0;
  d.perPraktijk.forEach(function (p) {
    tot += p.totaal;
    h += '<div class="card"><div class="grp-head"><h3>' + esc(p.naam) + '</h3><div class="bedrag">' + esc(geld(p.totaal)) + '</div></div>' +
      '<table class="kv"><tr><td>Dagen</td><td>' + p.dagen + '</td></tr><tr><td>Uren</td><td>' + esc(nf(p.uren)) + '</td></tr>' +
      (p.soort === 'praktijk' ? '<tr><td>Kilometers (woon-werk + visites)</td><td>' + esc(nf(p.km, 1)) + '</td></tr>' : '') +
      '<tr><td>Bedrag werk</td><td>' + esc(geld(p.bedrag)) + '</td></tr>' +
      (p.soort === 'praktijk' ? '<tr><td>KM-vergoeding</td><td>' + esc(geld(p.kmVerg)) + '</td></tr>' : '') + '</table>' +
      '<details><summary>Bekijk de dagen</summary><ul class="daglijst">';
    p.lijst.forEach(function (x) {
      h += '<li><span>' + esc(datumKort(x.datum)) + ' · ' + esc(uurTekst(x.uren)) + '</span><span>' + esc(geld(x.totaal)) + ' ' +
        (x.status === 'betaald' ? '✓' : x.status === 'verstuurd' ? '?' : '') + '</span></li>';
    });
    h += '</ul></details></div>';
  });
  if (d.perPraktijk.length) h += '<div class="card"><div class="grp-head"><h3>Totaal ' + esc(MAANDEN[d.maand - 1]) + '</h3><div class="bedrag">' + esc(geld(tot)) + '</div></div></div>';
  $('#view').innerHTML = h;
  document.querySelectorAll('[data-jaar]').forEach(function (b) { b.onclick = function () { S.overzicht.jaar = Number(b.getAttribute('data-jaar')); laadOverzicht(); }; });
  document.querySelectorAll('[data-maand]').forEach(function (b) { b.onclick = function () { S.overzicht.maand = Number(b.getAttribute('data-maand')); laadOverzicht(); }; });
  document.querySelectorAll('[data-eenheid]').forEach(function (b) { b.onclick = function () {
    S.overzicht.eenheid = b.getAttribute('data-eenheid');
    try { localStorage.setItem('werkadmin-eenheid', S.overzicht.eenheid); } catch (e) {}
    var y = window.scrollY; renderOverzicht(d); window.scrollTo(0, y);
  }; });
  koppelTips(d, eur);
}

function geldKort(x) { return '€ ' + nf(Math.round(x)); }

function koppelTips(d, eur) {
  var tip = $('#tip');
  if (!tip) { tip = document.createElement('div'); tip.id = 'tip'; tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip); }
  tip.hidden = true;
  var cats = eur ? EURCATS : CATS;
  document.querySelectorAll('[data-tip-cat]').forEach(function (seg) {
    var m = d.maanden[Number(seg.closest('[data-maand]').getAttribute('data-maand')) - 1];
    var k = seg.getAttribute('data-tip-cat');
    var naam = cats.filter(function (c) { return c[0] === k; })[0][1];
    var u = eur ? m.eur[k] : Math.round(m.cat[k] * 100) / 100;
    var tot = eur ? m.omzet : m.totaal;
    seg.onmouseenter = function () {
      tip.innerHTML = '<div class="r"><span><i class="c-' + k + '"></i><b style="display:inline">' + esc(naam) + '</b></span></div>' +
        esc(eur ? geld(u) : uurTekst(u)) + ' in ' + esc(MAANDEN[m.maand - 1]) + '<br><span style="opacity:.7">' + Math.round(u / tot * 100) + '% van ' +
        esc(eur ? geld(tot) : nf(tot, 2) + ' u') + '</span>';
      tip.hidden = false;
    };
    seg.onmousemove = function (e) {
      var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
      tip.style.left = x + 'px'; tip.style.top = (e.clientY - tip.offsetHeight - 12) + 'px';
    };
    seg.onmouseleave = function () { tip.hidden = true; };
  });
}

/* ===================== Nascholing ===================== */
function laadNascholing() {
  if (!S.nascholingJaar) S.nascholingJaar = Number(S.init.vandaag.slice(0, 4));
  snelLaad('nascholing', 'getNascholingen', [S.nascholingJaar], renderNascholing, 'Nascholingen ophalen…', 'laadNascholing');
}

function puntenModal(naam, datum, huidig, opslaan) {
  modal('<h3>' + (huidig === null ? 'Punten toevoegen' : 'Punten wijzigen') + '</h3>' +
    '<p class="muted small" style="margin-top:-6px">' + esc(naam) + ' · ' + esc(datum) + '</p>' +
    '<label class="lbl" for="mpt">Accreditatiepunten</label>' +
    '<input type="text" inputmode="decimal" id="mpt" placeholder="Bijv. 2" value="' + (huidig === null ? '' : esc(nf(huidig))) + '">' +
    '<div id="mptfout"></div><div class="stack" style="margin-top:14px"><button class="btn" id="mptok">Opslaan</button>' +
    '<button class="btn ghost" id="mptweg">Annuleren</button></div>');
  var veld = $('#mpt'); veld.focus(); veld.select();
  $('#mptweg').onclick = function () { modal(''); };
  var klaar = function () {
    var pt = parseNum(veld.value);
    if (pt === null || isNaN(pt) || pt <= 0 || pt > 200) { $('#mptfout').innerHTML = '<div class="err">Vul het aantal punten in (bijv. 2 of 1,5).</div>'; return; }
    var knop = $('#mptok'); knop.disabled = true; knop.textContent = 'Bezig…';
    opslaan(pt).then(function () { modal(''); toast('Punten opgeslagen.'); laadNascholing(); })
      .catch(function (e) { $('#mptfout').innerHTML = '<div class="err">' + esc(foutTekst(e)) + '</div>'; knop.disabled = false; knop.textContent = 'Opslaan'; });
  };
  $('#mptok').onclick = klaar;
  veld.onkeydown = function (e) { if (e.key === 'Enter') klaar(); };
}

function renderNascholing(d) {
  var jaarNu = Number(S.init.vandaag.slice(0, 4));
  var h = '<div class="chips" style="margin-top:8px">';
  [jaarNu - 1, jaarNu].forEach(function (j) { h += '<button class="chip' + (j === d.jaar ? ' on' : '') + '" data-njaar="' + j + '">' + j + '</button>'; });
  h += '</div>';
  var ontv = 0, verw = 0;
  d.items.forEach(function (x) { if (x.ontvangen) ontv += x.punten; else verw += x.punten; });
  h += '<div class="card" style="margin-top:12px"><div class="row2"><div><div class="muted small">Punten ontvangen</div><div class="big">' + esc(nf(ontv)) + '</div></div>' +
    '<div><div class="muted small">Nog te ontvangen</div><div class="big" style="color:var(--muted)">' + esc(nf(verw)) + '</div></div></div>' +
    '<p class="small muted" style="margin:10px 0 0">Nascholingsuren in ' + d.jaar + ': <b>' + esc(uurTekst(d.uren)) + '</b></p></div>';

  h += '<h2>Accreditatiepunten</h2>';
  if (!d.items.length) h += '<div class="card muted">Nog geen nascholingen met punten in ' + d.jaar + '. Vul punten in bij een nascholingsdag, of voeg ze hieronder toe.</div>';
  d.items.forEach(function (x, i) {
    h += '<div class="card"><div class="grp-head"><div><h3>' + esc(x.naam) + '</h3><div class="muted small">' + esc(datumKort(x.datum)) + ' · ' + esc(x.soort) + '</div></div>' +
      '<button class="pt-knop heeft" data-pitem="' + i + '" aria-label="Punten wijzigen">' + esc(nf(x.punten)) + ' pt ✎</button></div>' +
      '<label class="switch"><input type="checkbox" data-punt="' + i + '"' + (x.ontvangen ? ' checked' : '') + '> Punten ontvangen</label></div>';
  });
  h += '<div class="card"><h3>Punten toevoegen</h3><p class="small muted" style="margin:0">Voor een nascholing die je nog niet hebt ingevuld.</p>' +
    '<label class="lbl" for="nd">Datum</label><input type="date" id="nd" value="' + esc(S.init.vandaag) + '">' +
    '<label class="lbl" for="nn">Nascholing</label><input type="text" id="nn" placeholder="Bijv. Huisartsendagen">' +
    '<label class="lbl" for="np">Punten</label><input type="text" inputmode="decimal" id="np" placeholder="Bijv. 6">' +
    '<div id="nfout"></div><button class="btn" id="ntoevoegen" style="margin-top:14px">Toevoegen</button></div>';

  if (d.dagen.length) {
    h += '<h2>Nascholingsdagen in je urenregistratie</h2><div class="card recent"><ul>';
    h += '<p class="small muted" style="margin:-4px 0 10px">Tik op "+ punten" om accreditatiepunten bij een dag te zetten.</p>';
    d.dagen.forEach(function (x, i) {
      h += '<li class="nas-dag"><span><b>' + esc(datumKort(x.datum)) + '</b> · ' + esc(x.naam) + '<br><span class="muted small">' + esc(uurTekst(x.uren)) + '</span></span>' +
        (x.puntRij ? '<button class="pt-knop heeft" data-pdag="' + i + '">' + esc(nf(x.punten)) + ' pt ✎</button>'
          : '<button class="pt-knop" data-pdag="' + i + '">+ punten</button>') + '</li>';
    });
    h += '</ul></div>';
  }
  $('#view').innerHTML = h;
  document.querySelectorAll('[data-njaar]').forEach(function (b) { b.onclick = function () { S.nascholingJaar = Number(b.getAttribute('data-njaar')); laadNascholing(); }; });
  document.querySelectorAll('[data-punt]').forEach(function (cb) {
    cb.onchange = function () {
      var x = d.items[Number(cb.getAttribute('data-punt'))];
      cb.disabled = true;
      call('zetPuntenOntvangen', x.rij, x.naam, cb.checked).then(function () { laadNascholing(); })
        .catch(function (e) { cb.checked = !cb.checked; cb.disabled = false; toast(foutTekst(e)); });
    };
  });
  document.querySelectorAll('[data-pitem]').forEach(function (k) {
    k.onclick = function () {
      var x = d.items[Number(k.getAttribute('data-pitem'))];
      puntenModal(x.naam, datumKort(x.datum), x.punten, function (pt) { return call('wijzigPunten', x.rij, x.naam, pt); });
    };
  });
  document.querySelectorAll('[data-pdag]').forEach(function (k) {
    k.onclick = function () {
      var x = d.dagen[Number(k.getAttribute('data-pdag'))];
      puntenModal(x.naam, datumKort(x.datum), x.puntRij ? x.punten : null, function (pt) {
        return x.puntRij ? call('wijzigPunten', x.puntRij, x.naam, pt)
          : call('voegNascholingToe', { datum: x.datum, naam: x.naam, punten: pt, uren: x.uren, soort: x.soort });
      });
    };
  });
  $('#ntoevoegen').onclick = function () {
    var item = { datum: $('#nd').value, naam: $('#nn').value.trim(), punten: $('#np').value, soort: 'nascholing' };
    var pt = parseNum(item.punten);
    var fout = !item.datum ? 'Kies een datum.' : !item.naam ? 'Vul de naam in.' : (pt === null || isNaN(pt) || pt <= 0) ? 'Vul het aantal punten in.' : '';
    if (fout) { $('#nfout').innerHTML = '<div class="err">' + esc(fout) + '</div>'; return; }
    var knop = $('#ntoevoegen'); knop.disabled = true; knop.textContent = 'Bezig…';
    call('voegNascholingToe', item).then(function () { toast('Toegevoegd.'); laadNascholing(); })
      .catch(function (e) { $('#nfout').innerHTML = '<div class="err">' + esc(foutTekst(e)) + '</div>'; knop.disabled = false; knop.textContent = 'Toevoegen'; });
  };
}

start();
</script>
</body>
</html>
